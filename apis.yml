name: Hertha Metals
description: Hertha Metals is a hard-technology steel production company based in Conroe, Texas, working
  to decarbonize and modernize primary steelmaking after centuries of coke-based blast-furnace iron and
  steel production. Founded by Laureen Meroueh, the company has developed proprietary pyrometallurgical
  HERS and Flex-HERS technology that produces steel from flexible feedstocks in a single reactor,
  and has raised roughly $17M toward a commercial steel plant. Hertha Metals is an industrial /
  climate-tech manufacturer with no public API, developer portal, or programmatic surface; it is tracked
  in the API Evangelist network as a Khosla Ventures portfolio company profile.
